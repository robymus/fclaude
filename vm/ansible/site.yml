---
# fclaude in-VM provisioning. Run by cloud-init on first boot:
#   ansible-playbook -c local -i localhost, site.yml
# Keep this a single self-contained playbook (it is shipped base64-embedded in
# the cloud-init user-data).
- name: Provision fclaude VM
  hosts: localhost
  connection: local
  become: true
  vars:
    fclaude_user: fclaude
    node_major: "22"

  tasks:
    - name: Wait for any background apt/dpkg locks to clear
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600

    - name: Install base tooling
      ansible.builtin.apt:
        name:
          - nfs-common
          - curl
          - ca-certificates
          - gnupg
          - build-essential
          - unzip
          - jq
          - ripgrep
          - git
          - qemu-guest-agent
        state: present

    # --- Docker (requirement: claude in the VM can use docker) ---
    - name: Check for docker
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: Install Docker Engine via get.docker.com
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker
      when: not docker_bin.stat.exists

    - name: Add fclaude to the docker group
      ansible.builtin.user:
        name: "{{ fclaude_user }}"
        groups: docker
        append: true

    - name: Enable docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # --- Node.js (for the agent's own project work, NOT for Claude Code) ---
    # Claude Code no longer runs on Node (it's a self-contained native binary,
    # installed below). Node stays because a general dev sandbox needs node/npm
    # for user projects; it is kept current by the weekly apt upgrade timer.
    - name: Check for node
      ansible.builtin.stat:
        path: /usr/bin/node
      register: node_bin

    - name: Add NodeSource repo
      ansible.builtin.shell: "curl -fsSL https://deb.nodesource.com/setup_{{ node_major }}.x | bash -"
      args:
        creates: /etc/apt/sources.list.d/nodesource.list
      when: not node_bin.stat.exists

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    # --- Claude Code (native installer; per-user, hot-update-safe) ---
    # The native installer keeps per-version dirs under
    # ~/.local/share/claude/versions and atomically swaps ~/.local/bin/claude, so
    # its background auto-updater can update while sessions run. Installed AS the
    # fclaude user (never root) so ~/.local is user-owned and self-update works.
    # PATH resolution for non-interactive ssh is handled by ~/.profile (which
    # Ubuntu points at ~/.local/bin) + the wrapper's CLAUDE_LOGIN_ENV.
    - name: Install Claude Code via the native installer (latest channel)
      become: true
      become_user: "{{ fclaude_user }}"
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: "/home/{{ fclaude_user }}/.local/bin/claude"
        executable: /bin/bash

    - name: Pin Claude Code to the latest auto-update channel (merge, don't clobber)
      become: true
      become_user: "{{ fclaude_user }}"
      ansible.builtin.shell: |
        set -e
        f="$HOME/.claude/settings.json"
        mkdir -p "$HOME/.claude"
        if [ -s "$f" ]; then
          tmp="$(mktemp)"
          jq '. + {autoUpdatesChannel: "latest"}' "$f" > "$tmp" && mv "$tmp" "$f"
        else
          printf '{\n  "autoUpdatesChannel": "latest"\n}\n' > "$f"
        fi
      args:
        executable: /bin/bash
      changed_when: false   # idempotent merge; avoids false "changed" churn

    # --- Headless browser runtime libs (infra only; NO browser installed) ---
    - name: Install headless-chrome runtime dependencies
      ansible.builtin.apt:
        name:
          - libnss3
          - libatk-bridge2.0-0
          - libatk1.0-0
          - libcups2
          - libgbm1
          - libasound2t64
          - libgtk-3-0
          - libxshmfence1
          - fonts-liberation
        state: present

    # --- Workspace mount base ---
    - name: Ensure /home/fclaude exists and is owned by fclaude
      ansible.builtin.file:
        path: /home/fclaude
        state: directory
        owner: "{{ fclaude_user }}"
        group: "{{ fclaude_user }}"
        mode: '0755'

    # --- Host-path bind mount for seamless editor/CLI path matching ---
    # Claude reports ABSOLUTE paths (resolved via getcwd) to the VS Code
    # extension, which does no path translation. Workspaces are shared at
    # /home/fclaude/<rel>, but the host knows those files as
    # /home/{{ host_user }}/<rel>. A symlink would be canonicalized away by
    # getcwd (back to /home/fclaude); a BIND MOUNT preserves the path so claude
    # reports host-matching paths. The root mount is shared, so workspace NFS
    # mounts made later under /home/fclaude propagate through this bind.
    # Passed from cloud-init as `-e host_user=<host login>`; skipped when the
    # host user is 'fclaude' (the bind would point at itself).
    - name: Create host-home bind mountpoint
      ansible.builtin.file:
        path: "/home/{{ host_user }}"
        state: directory
        owner: "{{ fclaude_user }}"
        group: "{{ fclaude_user }}"
        mode: '0755'
      when:
        - host_user is defined
        - host_user | length > 0
        - host_user != fclaude_user

    - name: Bind-mount /home/fclaude onto the host home path (persisted in fstab)
      ansible.posix.mount:
        path: "/home/{{ host_user }}"
        src: /home/fclaude
        fstype: none
        opts: bind
        state: mounted
      when:
        - host_user is defined
        - host_user | length > 0
        - host_user != fclaude_user

    # --- Weekly apt/system-package upgrade (optional; network-speed gated) ---
    # Claude Code updates itself (native auto-updater); this timer keeps apt /
    # Docker / Node current. The script + units are the canonical files under
    # vm/update/, injected here as base64 by install.sh's render step (the whole
    # playbook is shipped base64-embedded in the cloud-init seed, so it can't read
    # external files at first boot — hence the placeholders).
    - name: Install the weekly apt-upgrade script
      ansible.builtin.copy:
        dest: /usr/local/sbin/fclaude-apt-upgrade.sh
        content: "{{ '__APT_UPGRADE_SH_B64__' | b64decode }}"
        owner: root
        group: root
        mode: '0755'

    - name: Install the apt-upgrade systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/fclaude-apt-upgrade.service
        content: "{{ '__APT_UPGRADE_SERVICE_B64__' | b64decode }}"
        owner: root
        group: root
        mode: '0644'

    - name: Install the apt-upgrade systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/fclaude-apt-upgrade.timer
        content: "{{ '__APT_UPGRADE_TIMER_B64__' | b64decode }}"
        owner: root
        group: root
        mode: '0644'

    - name: Configure the weekly apt-upgrade defaults (EnvironmentFile)
      ansible.builtin.copy:
        dest: /etc/default/fclaude-update
        owner: root
        group: root
        mode: '0644'
        content: |
          # fclaude weekly apt upgrade — read by /usr/local/sbin/fclaude-apt-upgrade.sh
          # Re-apply host-side knobs with: ./host/bin/fclaude-update-setup
          FCLAUDE_UPDATE_APT={{ fclaude_update_apt | default('1') }}
          # Network gate (uncomment to override the script's built-in defaults):
          # FCLAUDE_UPDATE_MIN_MBIT=100
          # FCLAUDE_UPDATE_PROBE_URL=https://speed.cloudflare.com/__down?bytes=10000000
          # FCLAUDE_UPDATE_PROBE_MAXTIME=5

    - name: Seed the last-successful-update stamp (starts the staleness clock at provision time)
      ansible.builtin.shell: |
        set -e
        mkdir -p /var/lib/fclaude
        [ -f /var/lib/fclaude/last-apt-success ] || date -Is > /var/lib/fclaude/last-apt-success
      args:
        executable: /bin/bash
        creates: /var/lib/fclaude/last-apt-success

    - name: Enable + start the weekly apt-upgrade timer
      ansible.builtin.systemd:
        name: fclaude-apt-upgrade.timer
        daemon_reload: true
        enabled: true
        state: started
      when: (fclaude_update_apt | default('1')) | string == '1'

    # --- Headroom context-compression proxy (in-VM) ---
    # The fclaude wrappers point Claude at this shared proxy with
    # ANTHROPIC_BASE_URL (not `headroom wrap` — see lib/common.sh
    # _headroom_launch). Versioned venv + `current` symlink → hot-update-safe
    # (see fclaude-headroom-activate). base64 assets injected by install.sh.
    - name: Install python venv tooling for Headroom
      ansible.builtin.apt:
        name: [python3-venv, python3-pip]
        state: present

    - name: Install Headroom (headroom-ai[proxy]) into a versioned venv
      ansible.builtin.shell: |
        set -euo pipefail
        ver="$(python3 - <<'PY'
        import json, urllib.request
        print(json.load(urllib.request.urlopen("https://pypi.org/pypi/headroom-ai/json", timeout=30))["info"]["version"])
        PY
        )"
        dest="/opt/headroom/versions/${ver}"
        if [ ! -x "${dest}/bin/headroom" ]; then
          python3 -m venv "${dest}"
          "${dest}/bin/pip" install -q --upgrade pip
          "${dest}/bin/pip" install -q "headroom-ai[proxy]==${ver}"
        fi
        ln -sfn "${dest}" /opt/headroom/current
        ln -sfn /opt/headroom/current/bin/headroom /usr/local/bin/headroom
      args:
        executable: /bin/bash
        creates: /opt/headroom/current

    - name: Install Headroom activate + update scripts
      ansible.builtin.copy:
        dest: "/usr/local/sbin/{{ item.name }}"
        content: "{{ item.b64 | b64decode }}"
        mode: '0755'
      loop:
        - { name: fclaude-headroom-activate, b64: '__HEADROOM_ACTIVATE_SH_B64__' }
        - { name: fclaude-headroom-update.sh, b64: '__HEADROOM_UPDATE_SH_B64__' }

    - name: Install Headroom systemd units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.b64 | b64decode }}"
        mode: '0644'
      loop:
        - { name: fclaude-headroom.service, b64: '__HEADROOM_SERVICE_B64__' }
        - { name: fclaude-headroom-activate.service, b64: '__HEADROOM_ACTIVATE_SERVICE_B64__' }

    - name: Enable + start Headroom (proxy + boot activation) when enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        daemon_reload: true
        enabled: true
        state: started
      loop:
        - fclaude-headroom-activate.service
        - fclaude-headroom.service
      when: (fclaude_headroom_enable | default('1')) | string == '1'

    # Local (stdio) MCP servers Claude Code needs to act on what the proxy does:
    # `headroom` answers the `[Retrieve more: hash=…]` markers compression leaves
    # behind, `tokensave` is the code-graph compressor. `headroom wrap` used to
    # register both on every session start; the wrappers no longer call wrap (it
    # wrote settings into the mounted host repo — see lib/common.sh
    # _headroom_launch), so provisioning owns this now. Registration is durable
    # USER-scope state, so once is enough. `claude mcp get` is the idempotency
    # check: it is authoritative regardless of where the CLI persists the entry.
    - name: Register the Headroom retrieve MCP server (user scope)
      become: true
      become_user: "{{ fclaude_user }}"
      ansible.builtin.shell: |
        set -uo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        if claude mcp get headroom >/dev/null 2>&1; then exit 0; fi
        headroom mcp install --agent claude
      args:
        executable: /bin/bash
      changed_when: false
      when: (fclaude_headroom_enable | default('1')) | string == '1'

    # Git ignores ~/.config/git/ignore by DEFAULT (the XDG path), with no
    # core.excludesFile needed. Ignoring the code-graph store globally keeps a
    # 200 MB-class binary index out of `git status` in every repo, without a
    # per-repo .gitignore diff — and it makes the wrappers' own .gitignore step
    # stand down, since `git check-ignore` (its test) honours this file.
    # lineinfile, not copy: never clobber ignores the user added themselves.
    - name: Globally git-ignore the tokensave code-graph store
      become: true
      become_user: "{{ fclaude_user }}"
      ansible.builtin.lineinfile:
        path: "/home/{{ fclaude_user }}/.config/git/ignore"
        line: "{{ item }}"
        create: true
        mode: '0644'
      loop:
        - "# tokensave code-graph index (local, binary; created by fclaude sessions)"
        - ".tokensave/"

    # ensure_tokensave() fetches the release binary for this platform into
    # ~/.local/bin (a no-op once present) and returns its path, or nothing when
    # no asset exists / the download fails. tokensave is an optimization, so an
    # empty result is logged and skipped rather than failing the provision.
    - name: Install the tokensave code-graph binary and register its MCP server
      become: true
      become_user: "{{ fclaude_user }}"
      ansible.builtin.shell: |
        set -uo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        if claude mcp get tokensave >/dev/null 2>&1; then exit 0; fi
        bin="$(/opt/headroom/current/bin/python - <<'PY'
        from headroom.graph.tokensave_installer import ensure_tokensave
        print(ensure_tokensave() or "")
        PY
        )"
        if [ -z "$bin" ]; then
          echo "tokensave unavailable for this platform — skipping registration"
          exit 0
        fi
        claude mcp add tokensave -s user -- "$bin" serve
      args:
        executable: /bin/bash
      changed_when: false
      when: (fclaude_headroom_enable | default('1')) | string == '1'

    # tokensave ships with `upload_enabled = true` — it reports token-savings
    # counts to a worldwide counter. Off here: fclaude sessions run on whatever
    # the user is working on, which includes private infrastructure repos, and
    # that is not a default worth inheriting silently. Without this a VM rebuild
    # would quietly opt back in, since the setting is VM-local state.
    #
    # Driven through the CLI rather than by writing ~/.tokensave/config.toml
    # directly, so tokensave owns the file's shape and its other defaults
    # (watcher_debounce, extraction_timeout_secs, …) are never half-written.
    # Idempotent: the command just sets the flag. Re-enable per VM with
    # `tokensave enable-upload-counter`.
    - name: Disable the tokensave worldwide-counter upload (telemetry)
      become: true
      become_user: "{{ fclaude_user }}"
      ansible.builtin.shell: |
        set -uo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        command -v tokensave >/dev/null 2>&1 || exit 0
        cd "$HOME" && tokensave disable-upload-counter
      args:
        executable: /bin/bash
      changed_when: false
      when: (fclaude_headroom_enable | default('1')) | string == '1'

    # tokensave's MCP server PREPENDS "⚠️ tokensave vX is installed, but vY is
    # available. Run `tokensave upgrade` to update." as an extra content block to
    # EVERY tool result (mcp/server.rs check_version_update) — inside the
    # payload, not on stderr — so one minor release upstream corrupts every
    # tokensave tool result until the binary is upgraded. TOKENSAVE_UPDATE_CHECK
    # turns off exactly that passive notice (init/sync/status + the MCP server);
    # explicit `tokensave upgrade` and `doctor` ignore it, so the weekly upgrade
    # in fclaude-headroom-update.sh keeps working.
    #
    # ~/.profile, not the MCP server's `env`: `tokensave reinstall` (run after
    # every upgrade) rewrites that registration and would drop it, whereas the
    # profile is read by every login shell in the VM — and claude's MCP servers
    # and tokensave's own hooks all inherit the environment from there. The
    # wrappers export the same flag on the session line (lib/common.sh
    # _tokensave_prepare_cmd), which is what covers VMs provisioned before this;
    # this task covers sessions the wrappers did not launch.
    # lineinfile, not a shell append: idempotent and it never clobbers the rest.
    - name: Silence the tokensave update notice (it corrupts MCP tool results)
      become: true
      become_user: "{{ fclaude_user }}"
      ansible.builtin.lineinfile:
        path: "/home/{{ fclaude_user }}/.profile"
        line: "{{ item }}"
        create: true
        mode: '0644'
      loop:
        - "# tokensave: its update notice is injected into MCP tool results, not stderr"
        - "export TOKENSAVE_UPDATE_CHECK=0"
      when: (fclaude_headroom_enable | default('1')) | string == '1'

    # --- Metrics agent (prometheus --agent) — config + token delivered host-side ---
    # by fclaude-metrics-setup (install.sh step 14). The unit is gated on those
    # files existing, so it stays inactive until the secret lands.
    - name: Install pinned prometheus (agent mode) binary
      ansible.builtin.shell: |
        set -euo pipefail
        ver="__FCLAUDE_PROMETHEUS_VERSION__"
        cd /tmp
        curl -fsSL -o prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz"
        tar xzf prom.tgz
        install -m755 "prometheus-${ver}.linux-amd64/prometheus" /usr/local/bin/prometheus
        rm -rf prom.tgz "prometheus-${ver}.linux-amd64"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/prometheus
      when: (fclaude_metrics_enable | default('1')) | string == '1'

    - name: Install metrics agent unit (started later by fclaude-metrics-setup)
      ansible.builtin.copy:
        dest: /etc/systemd/system/fclaude-metrics.service
        content: "{{ '__METRICS_SERVICE_B64__' | b64decode }}"
        mode: '0644'
      when: (fclaude_metrics_enable | default('1')) | string == '1'

    - name: Prepare metrics agent WAL dir (fclaude-owned)
      ansible.builtin.file:
        path: /var/lib/fclaude/prom-agent
        state: directory
        owner: "{{ fclaude_user }}"
        group: "{{ fclaude_user }}"
        mode: '0700'
      when: (fclaude_metrics_enable | default('1')) | string == '1'
