name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck + ansible-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          python3 -m pip install --quiet ansible-core
          # site.yml uses ansible.posix.mount (bind mount); syntax-check resolves
          # module references, so the collection must be present.
          ansible-galaxy collection install ansible.posix

      - name: Shellcheck (all shell scripts)
        run: |
          shellcheck -x \
            install.sh uninstall.sh \
            lib/*.sh \
            host/bin/fclaude host/bin/fclaude-vscode host/bin/fclaude-grow-disk \
            host/bin/fclaude-update-setup host/bin/fclaude-metrics-setup \
            vm/update/*.sh vm/headroom/*.sh \
            test/*.sh

      - name: Unit tests
        run: |
          bash test/test-staleness.sh
          bash test/test-mount-hold.sh

      - name: Ansible syntax-check (rendered playbook)
        run: |
          # Mirror install.sh's base64 injection of the VM assets, then
          # syntax-check the fully-rendered playbook.
          rendered="$(mktemp --suffix=.yml)"
          cp vm/ansible/site.yml "$rendered"
          inject() { local ph="$1" f="$2" b; b="$(base64 -w0 "$f")"; sed -i "s|${ph}|${b}|g" "$rendered"; }
          inject __APT_UPGRADE_SH_B64__          vm/update/fclaude-apt-upgrade.sh
          inject __APT_UPGRADE_SERVICE_B64__     vm/update/fclaude-apt-upgrade.service
          inject __APT_UPGRADE_TIMER_B64__       vm/update/fclaude-apt-upgrade.timer
          inject __HEADROOM_SERVICE_B64__        vm/headroom/fclaude-headroom.service
          inject __HEADROOM_QUIET_B64__          vm/headroom/headroom-quiet
          inject __HEADROOM_ACTIVATE_SH_B64__    vm/headroom/fclaude-headroom-activate.sh
          inject __HEADROOM_ACTIVATE_SERVICE_B64__ vm/headroom/fclaude-headroom-activate.service
          inject __HEADROOM_UPDATE_SH_B64__      vm/update/fclaude-headroom-update.sh
          inject __METRICS_SERVICE_B64__         vm/metrics/fclaude-metrics.service
          sed -i "s|__FCLAUDE_PROMETHEUS_VERSION__|3.13.1|g" "$rendered"
          ansible-playbook --syntax-check -i localhost, "$rendered"
          # No injection placeholders may remain unresolved.
          if grep -qoE '__[A-Z_]+_B64__' "$rendered"; then
            echo "unresolved base64 placeholders in rendered playbook:" >&2
            grep -oE '__[A-Z_]+_B64__' "$rendered" | sort -u >&2
            exit 1
          fi

      - name: Prometheus config renders + validates
        run: |
          # Render prometheus.yml.tmpl with dummy url/user/labels and validate it.
          curl -fsSL -o /tmp/prom.tgz \
            https://github.com/prometheus/prometheus/releases/download/v3.13.1/prometheus-3.13.1.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tgz -C /tmp
          sed -e 's|__GC_PROM_URL__|https://example.grafana.net/api/prom/push|g' \
              -e 's|__GC_PROM_USER__|123456|g' \
              -e 's|__FCLAUDE_METRICS_HOST_LABEL__|darkness|g' \
              -e 's|__FCLAUDE_METRICS_VM_LABEL__|fclaude|g' \
              vm/metrics/prometheus.yml.tmpl > /tmp/prometheus.yml
          /tmp/prometheus-3.13.1.linux-amd64/promtool check config /tmp/prometheus.yml

      - name: Secrets are encrypted (no plaintext token)
        run: |
          # The committed secret must be SOPS ciphertext, never a plaintext glc_ token.
          if grep -qE 'gc_prom_token:\s*glc_' secrets/secrets.sops.yaml; then
            echo "secrets/secrets.sops.yaml contains a plaintext token!" >&2
            exit 1
          fi
          grep -q '^sops:' secrets/secrets.sops.yaml || { echo "secret is not SOPS-encrypted" >&2; exit 1; }
