name: Release (Windows, experimental)

# Tag v<semver>-win* (e.g. v0.1.0-win-experimental) to publish fclaude-setup.exe.
on:
  push:
    tags: ['v*-win*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install isoinfo
        run: sudo apt-get update -qq && sudo apt-get install -y genisoimage

      # Same gate as CI: never publish a binary that fails lint or tests.
      - name: golangci-lint (windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.15
      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Build fclaude-setup.exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/fclaude-setup.exe ./cmd/fclaude-win
          (cd dist && sha256sum fclaude-setup.exe > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fclaude-setup.exe dist/SHA256SUMS \
            --prerelease --title "fclaude for Windows ${GITHUB_REF_NAME} (experimental)" \
            --notes "Experimental Windows build. See windows/README.md. The binary is unsigned: SmartScreen will warn (More info → Run anyway)."
