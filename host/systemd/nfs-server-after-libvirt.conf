# Installed to /etc/systemd/system/nfs-server.service.d/fclaude.conf
#
# fclaude binds nfsd to the libvirt gateway address (192.168.122.1, see
# /etc/nfs.conf.d/fclaude.conf). That address only exists once the libvirt
# 'default' network has brought up its bridge (virbr0), so we order after the
# libvirt network daemons. libvirtd being "active" does NOT guarantee the bridge
# address is assigned yet, so ExecStartPre waits for it before rpc.nfsd binds.
#
# Do NOT order against network-online.target here. nfsd binds only to the
# libvirt gateway, never the host uplink, so that target is semantically wrong —
# and pulling it in (via Wants=) created a boot-time ordering cycle: systemd
# deleted network-online.target's start job to break the cycle, which knocked
# nfs-server out of the boot transaction, so it silently never started and every
# workspace mount failed with "Connection refused". Absent units (e.g. a
# monolithic libvirtd) are ignored by systemd ordering.
[Unit]
After=virtnetworkd.service libvirtd.service

[Service]
# Wait (up to 30s) for the libvirt gateway address to appear before binding.
# -w avoids matching the VM's .10 address; bridge-name-agnostic on purpose.
# $$ escapes systemd's own $-expansion so the literal $(...) reaches the shell.
ExecStartPre=/bin/sh -c 'for i in $$(seq 1 30); do ip -4 addr show | grep -qw 192.168.122.1 && exit 0; sleep 1; done; echo "fclaude: libvirt gateway 192.168.122.1 not up after 30s; nfsd bind will fail" >&2; exit 1'
