# Installed to /etc/systemd/system/nfs-server.service.d/fclaude.conf
#
# fclaude binds nfsd to the libvirt gateway address (192.168.122.1, see
# /etc/nfs.conf.d/fclaude.conf). That address only exists once the libvirt
# 'default' network has brought up its bridge. Without this ordering, nfs-server
# can start at boot before the bridge exists and fail to bind. Absent units
# (e.g. on a monolithic libvirtd) are ignored by systemd ordering.
[Unit]
After=virtnetworkd.service libvirtd.service network-online.target
Wants=network-online.target
