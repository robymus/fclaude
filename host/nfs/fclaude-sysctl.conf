# Installed to /etc/sysctl.d/90-fclaude-nfs.conf
# Stop nfsd granting NFSv4 delegations; it implements them as kernel leases.
#
# A file the VM creates gets a write delegation, which is a lease on the host's
# inode. Any host-side open(O_NONBLOCK) then fails with EAGAIN while the lease
# is recalled. VS Code opens files that way, so the first open of every file the
# VM created fails with "Unknown (FileSystemError)" and the retry succeeds.
# nfsd has no per-export switch for delegations, so this is host-wide: it also
# disables fcntl(F_SETLEASE) for every other process on the host.
fs.leases-enable = 0
