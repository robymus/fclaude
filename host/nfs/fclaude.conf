# Installed to /etc/nfs.conf.d/fclaude.conf
# Force NFSv4-only so the server needs only port 2049 (>=1024), keeping it
# inside the fclaude firewall's "unprivileged ports allowed" rule. This avoids
# rpcbind (111) and mountd, which would be blocked as privileged ports.
[nfsd]
vers3=n
vers4=y
# Bind the daemon to the libvirt gateway address only (not the LAN).
host=__FCLAUDE_HOST_IP__
